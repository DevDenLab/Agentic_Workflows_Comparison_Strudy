[project]
name = "service-desk-triage"
version = "0.1.0"
description = "Conventional automation vs an agentic workflow on IT service-desk ticket triage, benchmarked honestly."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "holidays>=0.104",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "platformdirs>=4.2",
    "prometheus-client>=0.26.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "tenacity>=9.1.4",
    "typer>=0.12",
    "tzdata>=2024.1",  # zoneinfo has no system tz database on Windows or slim containers
    "uvicorn>=0.52.4",
]

[project.scripts]
triage = "triage.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "import-linter>=2.1",
    "matplotlib>=3.11.2",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

# ---------------------------------------------------------------- lint / types

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "DTZ", "T20", "PT", "S"]
# Reports use real typography: an en dash in number ranges and a multiplication sign.
allowed-confusables = ["–", "×"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
# tests/ has several conftest.py files; map them by path so their module names don't collide.
mypy_path = ["src", "."]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = [
    "eval: probabilistic test graded against labelled data; excluded from the deterministic suite",
]

[tool.coverage.run]
source = ["triage"]
branch = true

# ---------------------------------------------------------------- module boundaries
# These contracts are the architecture. CI fails if an import crosses a line.

[tool.importlinter]
root_package = "triage"

[[tool.importlinter.contracts]]
name = "contracts is the shared vocabulary and depends on nothing internal"
type = "forbidden"
source_modules = ["triage.contracts"]
forbidden_modules = [
    "triage.config",
    "triage.observability",
    "triage.container",
    "triage.cli",
    "triage.v1",
    "triage.llm",
    "triage.hybrid",
    "triage.v2",
    "triage.bench",
]

[[tool.importlinter.contracts]]
name = "v1 is zero-inference: it never imports LLM code"
type = "forbidden"
source_modules = ["triage.v1"]
forbidden_modules = ["triage.llm", "triage.hybrid", "triage.v2"]

[[tool.importlinter.contracts]]
name = "the benchmark sees pipelines only through the contract"
type = "forbidden"
source_modules = ["triage.bench"]
forbidden_modules = ["triage.v1", "triage.llm", "triage.hybrid", "triage.v2"]

[[tool.importlinter.contracts]]
name = "only the composition root wires objects together"
type = "forbidden"
source_modules = [
    "triage.config",
    "triage.observability",
    "triage.v1",
    "triage.llm",
    "triage.hybrid",
    "triage.v2",
    "triage.bench",
]
forbidden_modules = ["triage.container", "triage.cli"]
