# Resolution targets per priority, and the business calendar they run on.
# Times are local to `timezone` in settings.yaml.
version: 1.0.0

business_hours:
  start: "08:00"
  end: "17:00"
  days: [mon, tue, wed, thu, fri]

holidays:          # statutory holidays from the `holidays` package; no business time accrues on them
  country: CA
  subdivision: AB

targets:           # clock: calendar = 24x7, business = business hours only
  P1: { hours: 4, clock: calendar }
  P2: { hours: 8, clock: business }
  P3: { hours: 24, clock: business }
  P4: { hours: 45, clock: business }
