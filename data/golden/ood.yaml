# Golden set — out-of-distribution split.
# The same kinds of problems, described the way busy staff actually write: no IT vocabulary,
# symptoms instead of product names, typos, plurals, another language.
# Labels follow docs/labelling-guide.md (service-desk policy), never rules.yaml.
split: ood
reviewed_by: Tatva Joshi
reviewed_on: 2026-09-14
cases:
